<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ xem nội dung sạch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #4a5568;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        input[type="url"] {
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            width: 100%;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        button:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .note {
            background: #f7fafc;
            border-left: 4px solid #667eea;
            padding: 15px;
            text-align: left;
            border-radius: 0 8px 8px 0;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #4a5568;
        }

        .features {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .feature-icon {
            color: #48bb78;
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            color: white;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Xem Nội Dung Sạch</h1>
        <p class="subtitle">Dán link vào đây để loại bỏ quảng cáo và xem nội dung gốc</p>
        
        <div class="input-group">
            <input type="url" id="urlInput" placeholder="https://example.com/bai-viet-hay-nhung-nhieu-quang-cao" required>
            <button onclick="viewCleanContent()">Xem nội dung sạch</button>
        </div>

        <div class="note">
            <strong>Lưu ý:</strong> Công cụ này giúp loại bỏ quảng cáo, popup và các yếu tố gây phân tâm khác, mang lại trải nghiệm đọc tốt hơn.
        </div>

        <div class="features">
            <div class="feature">
                <span class="feature-icon">✓</span>
                <span>Chặn quảng cáo</span>
            </div>
            <div class="feature">
                <span class="feature-icon">✓</span>
                <span>Không popup</span>
            </div>
            <div class="feature">
                <span class="feature-icon">✓</span>
                <span>Giao diện sạch sẽ</span>
            </div>
        </div>
    </div>

    <footer>
        Công cụ hỗ trợ đọc nội dung | An toàn & Miễn phí
    </footer>

    <script>
        function viewCleanContent() {
            const urlInput = document.getElementById('urlInput');
            const url = urlInput.value.trim();
            
            // Kiểm tra URL có hợp lệ không
            if (!url) {
                alert('Vui lòng nhập URL cần xem!');
                return;
            }

            // Kiểm tra xem URL có hợp lệ không
            try {
                new URL(url);
            } catch (e) {
                alert('URL không hợp lệ! Vui lòng kiểm tra lại.');
                return;
            }

            // Mở URL trong tab mới với chế độ xem sạch
            // Ở đây chúng ta sẽ sử dụng một proxy đơn giản
            const cleanUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
            window.open(cleanUrl, '_blank');
        }

        // Cho phép nhấn Enter để submit
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                viewCleanContent();
            }
        });

        // Focus vào input khi trang load
        document.getElementById('urlInput').focus();
    </script>
</body>
</html>
