<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự báo thời tiết - Áp thấp nhiệt đới gần Biển Đông</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: white;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .title-box {
            width: 100%;
            max-width: 600px;
            margin-bottom: 16px;
        }

        #typing-title {
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 0.5px solid #0033FF;
            border-radius: 6px;
            box-shadow: inset 1px 1px 4px #ffffff,
                        inset -1px -1px 4px #b5b5b5;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            color: #0091FF;
            text-shadow: 
                1px 1px 0 #DAFFFF,
                1px 1px 3px rgba(0,0,0,0.9);
            margin: 0;
        }

        .center-link {
            text-align: center;
            width: 100%;
            max-width: 600px;
            margin-top: 20px; /* Khoảng cách giữa tiêu đề và liên kết */
        }

        .center-link a {
            text-decoration: none;
            font-weight: bold;
            font-size: larger;
            padding: 10px 20px; /* Khoảng cách bên trong nút */
            border: 2px solid #007BFF; /* Màu viền */
            border-radius: 6px; /* Làm tròn góc */
            background-color: #f8f9fa; /* Màu nền */
            color: #007BFF; /* Màu chữ */
            transition: background-color 0.3s, color 0.3s; /* Hiệu ứng chuyển đổi */
        }

        .center-link a:hover {
            background-color: #007BFF; /* Màu nền khi hover */
            color: white; /* Màu chữ khi hover */
        }
        .center-link a {
    font-size: 16px;   /* Giảm hoặc tăng tuỳ ý: 14px – 18px */
    line-height: 1.4;  /* Giúp chữ không bị dính nhau */
    display: inline-block;
    text-align: center;
}

    </style>
</head>
<body>
    <div class="title-box">
        <h1 id="typing-title"></h1>
    </div>
    <div class="center-link">
        <a href="https://nchmf.gov.vn/kttvsite/vi-VN/1/tin-du-bao-mua-lon-o-khu-vuc-tu-nam-quang-tri-den-tp-da-nang-phia-dong-cac-tinh-tu-quang-ngai-den-dak-lak-va-khanh-hoa-post51961.html" target="_blank">
            Nhấn vào đây <br> để xem tin mới nhất
        </a>
    </div>
             
    <script>
        const displayTitle = "TIN DỰ BÁO MƯA LỚN\nỞ KHU VỰC TỪ QUẢNG TRỊ ĐẾN TP. ĐÀ NẴNG,\nPHÍA ĐÔNG CÁC TỈNH\nTỪ QUẢNG NGÃI ĐẾN ĐẮK LẮK VÀ KHÁNH HÒA";
        const titleElement = document.getElementById("typing-title");
        let i = 0;
        let isDeleting = false;

        function type() {
            let currentText = displayTitle.substring(0, i);
            let htmlText = currentText.replace(/\n/g, '<br>');
            titleElement.innerHTML = htmlText;

            if (!isDeleting) {
                i++;
                if (i > displayTitle.length) {
                    setTimeout(() => {
                        isDeleting = true;
                        type();
                    }, 2000);
                    return;
                }
            } else {
                i--;
                if (i < 0) {
                    i = 0;
                    isDeleting = false;
                }
            }

            const speed = isDeleting ? 50 : 100;
            setTimeout(type, speed);
        }

        type();
    </script>
</body>
</html>
